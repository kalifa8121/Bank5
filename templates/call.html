<!-- Buttons Container -->
<div style="position: relative; z-index: 9999999; pointer-events: auto;" class="d-flex justify-content-center gap-3 mt-4">
  <button type="button" onclick="startCall('audio')" style="position: relative; z-index: 9999999; pointer-events: auto; cursor: pointer;" class="btn btn-primary px-4 py-2 fw-bold">
    🎤 Voice Call
  </button>
  <button type="button" onclick="startCall('video')" style="position: relative; z-index: 9999999; pointer-events: auto; cursor: pointer;" class="btn btn-success px-4 py-2 fw-bold">
    📹 Video Call
  </button>
  <button type="button" onclick="endCall()" style="position: relative; z-index: 9999999; pointer-events: auto; cursor: pointer;" class="btn btn-danger px-4 py-2 fw-bold">
    ❌ Call Cufi
  </button>
</div>
